[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "application/xml"

[[redirects]]
  from = "/ops/*"
  to   = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/thanks"
  to   = "/thanks.html"
  status = 200

[[redirects]]
  from = "/accessibility"
  to   = "/accessibility.html"
  status = 200

# Oct 2026: site is an email-collector only. Every old page goes home.
